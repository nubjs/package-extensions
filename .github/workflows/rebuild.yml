name: rebuild

# Rescan the corpus and regenerate the dataset.
#
# The scan pins an explicit nubjs/nub commit rather than a branch, so every
# record names the detector that produced it and an old run stays reproducible.

on:
  workflow_dispatch:
    inputs:
      nub_ref:
        description: A nubjs/nub commit SHA (or ref) to build the detector from
        required: true
        default: main
      top:
        description: How many of the most-downloaded packages to scan
        required: false
        default: '10000'
      concurrency:
        description: Parallel fetch/analyze workers
        required: false
        default: '8'
      commit:
        description: Commit the regenerated dataset to main
        type: boolean
        required: false
        default: true
  schedule:
    # Daily. The ecosystem moves under the dataset in both directions: packages
    # fix their manifests and their entries should disappear, and new versions
    # introduce undeclared imports that should appear. A day is also short
    # enough that any single diff stays readable.
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the detector ref to a full commit SHA
        id: nubref
        # `actions/checkout` only recognises a commit when the ref is the FULL
        # 40-character SHA; anything shorter is fetched as a branch/tag pattern,
        # which for an abbreviated SHA matches nothing and fails three retries
        # deep with `git failed with exit code 1` and no mention of the ref. An
        # abbreviation is exactly what `git log --oneline` hands you, so resolve
        # it here instead of leaving the trap armed. A branch name resolves to
        # its tip, which is what `main` already relied on.
        env:
          GH_TOKEN: ${{ github.token }}
          NUB_REF: ${{ inputs.nub_ref || 'main' }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/nubjs/nub/commits/$NUB_REF" --jq .sha) || {
            echo "::error::nub_ref '$NUB_REF' is not a commit, branch or tag in nubjs/nub"
            exit 1
          }
          echo "resolved $NUB_REF -> $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: nubjs/nub
          ref: ${{ steps.nubref.outputs.sha }}
          path: .nub

      - name: Record the detector's provenance
        id: prov
        run: |
          echo "sha=$(git -C .nub rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "run=$(date -u +%F)-top${{ inputs.top || '10000' }}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .nub/crates/nub-phantom

      - name: Build the detector
        run: cargo build --manifest-path .nub/crates/nub-phantom/Cargo.toml --release

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund

      - name: Scan
        run: |
          mkdir -p "records/${{ steps.prov.outputs.run }}"
          .nub/crates/nub-phantom/target/release/nub-phantom scan \
            --top "${{ inputs.top || '10000' }}" \
            --concurrency "${{ inputs.concurrency || '8' }}" \
            --json \
            > "records/${{ steps.prov.outputs.run }}/scan.json" \
            2> "records/${{ steps.prov.outputs.run }}/progress.log"

      - name: Record what produced this run
        run: |
          cat > "records/${{ steps.prov.outputs.run }}/meta.json" <<EOF
          {
            "run": "${{ steps.prov.outputs.run }}",
            "date": "$(date -u +%FT%TZ)",
            "detector": {
              "repository": "nubjs/nub",
              "commit": "${{ steps.prov.outputs.sha }}",
              "path": "crates/nub-phantom"
            },
            "corpus": {
              "ranking": "npm-high-impact topDownload",
              "top": ${{ inputs.top || '10000' }}
            },
            "workflowRun": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" \
            "records/${{ steps.prov.outputs.run }}/meta.json"

      - name: Build, emit and gate
        run: |
          node harness/build.mjs --scan "records/${{ steps.prov.outputs.run }}/scan.json"
          node harness/emit.mjs
          node harness/pack.mjs
          node harness/verify.mjs

      - name: Cross-check against Yarn's database
        run: node harness/compare-yarn.mjs --scan "records/${{ steps.prov.outputs.run }}/scan.json"

      - name: Probe the review queue and promote what reproduces
        # Installs each queued package alone under Yarn PnP with the fallback
        # off and imports it. A throw naming the target is proof the package
        # needs its own copy, which is the evidence a `dependencies` entry
        # requires — stronger than anything reading the source can give.
        run: |
          node harness/probe.mjs --queue 120 --concurrency 6 --promote
          node harness/build.mjs --scan "records/${{ steps.prov.outputs.run }}/scan.json"
          node harness/emit.mjs
          node harness/pack.mjs
          node harness/verify.mjs

      - name: Drop records older than 30 days
        if: ${{ inputs.commit != false }}
        run: |
          # A daily scan record is ~800 KB. Keeping every one grows the repo by
          # ~300 MB a year for data whose only consumer is a spot-check of how a
          # published entry was derived, and the last month covers that.
          #
          # Pruned by the DATE IN THE NAME, not by mtime: a fresh checkout stamps
          # every directory with the checkout time, so an mtime rule silently
          # never fires and the repo grows anyway.
          # `sort -r` puts newest first; `tail -n +31` takes everything past the
          # 30 to keep. Both forms are POSIX — `head -n -30` is GNU-only and
          # fails outright on BSD, which is exactly the kind of thing that only
          # shows up once the job has already committed.
          ls -d records/20*/ 2>/dev/null | sort -r | tail -n +31 | while read -r d; do rm -rf "$d"; done
          git add -A records

      - name: Commit
        if: ${{ inputs.commit != false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-extensions.json dist docs npm records inputs harness/overrides.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "rebuild: ${{ steps.prov.outputs.run }} against nub ${{ steps.prov.outputs.sha }}"
          git push
