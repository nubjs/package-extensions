name: Extensions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node harness/test-curated-seed.mjs
      - run: node --test harness/registry.test.mjs
      - run: node --test harness/downloads.test.mjs
      - run: node harness/verify.mjs
