# Stage @nubjs/extensions on npm via trusted publishing (OIDC).
#
# STAGE-ONLY (2026-09-22). The trusted publisher for this package allows only
# `npm stage publish`: a scheduled run puts the version in npm's staged queue,
# and a maintainer approves it with 2FA (`npm stage approve <id>`) before it is
# installable. CI cannot publish, so a stolen push credential cannot either.
# Nothing downstream needs the version live, so the run ends once it is staged.
#
# NO NPM_TOKEN. npm mints a short-lived credential from this job's OIDC identity,
# which is why `id-token: write` is the load-bearing permission — without it
# `npm stage publish` falls back to looking for a token and fails. The trust
# relationship is registered against THIS FILENAME (`release.yml`), so renaming
# or moving this file silently breaks publishing until the trust is re-created.
#
# Runs on a schedule after the daily rebuild, and on demand.
#
# The scheduled run publishes only when the RULES changed. A rebuild rewrites
# `generated` and any `measuredVersion` that ticked over, so comparing whole
# files would publish a version a day for data that did not move; comparing the
# `packageExtensions` map answers the only question a consumer cares about. When
# it has moved, the patch version is bumped and committed here, because the
# alternative is what this replaces: the repo's dataset advancing daily while npm
# sits at whatever version someone last remembered to bump by hand.
#
# The publish stays in THIS FILE rather than being called from `rebuild.yml`.
# npm's trusted publisher is registered against this workflow's FILENAME, and a
# reusable-workflow call or a `workflow_dispatch` from another job changes which
# identity npm sees — a `GITHUB_TOKEN`-triggered dispatch does not start a run at
# all, by GitHub's recursion guard.
name: Publish

on:
  schedule:
    # An hour after the rebuild's 06:23Z, so the day's data has landed on main.
    # Off the hour for the same reason the rebuild is — GitHub drops scheduled
    # runs at the top of the hour under load, and this one had never fired.
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and gate, but do not publish"
        type: boolean
        default: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` so a scheduled run can commit the version bump it
      # publishes. A manual run bumps nothing and only reads.
      contents: write
      # npm stage publish authenticates via OIDC trusted publishing, which mints its
      # credential from this identity. Nothing else here needs a token.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `npm stage publish` needs npm >= 11.15 and Node >= 22.14. The npm
          # bundled with Node 24 lags it, so the next step installs one.
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install an npm CLI that can stage
        run: | # zizmor: ignore[adhoc-packages] the npm CLI itself, pinned to the major that carries `npm stage`
          npm install -g npm@11
          v="$(npm --version)"
          [ "$(printf '%s\n11.15.0\n' "$v" | sort -V | head -1)" = "11.15.0" ] \
            || { echo "::error::npm $v cannot stage (need >= 11.15)"; exit 1; }
          echo "npm $v"

      - name: Check the toolchain can do OIDC
        run: |
          set -euo pipefail
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION, node $(node --version)"
          NPM_VERSION="$NPM_VERSION" node -e '
            const [maj, min, pat] = process.env.NPM_VERSION.split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) { console.error(`npm ${process.env.NPM_VERSION} is too old for trusted publishing (need >= 11.5.1)`); process.exit(1); }
          '

      - name: Install the harness dependencies
        # The gate below imports `yaml` and `semver`. `pack.mjs` needs neither,
        # so a release without this step builds a package fine and then dies at
        # the one check that protects it — which is how the first dry run of this
        # workflow failed. `ci` rather than `install`: a release resolves from the
        # committed lockfile or not at all.
        run: npm ci --no-audit --no-fund

      - name: Decide whether the rules moved, and bump if they did
        id: gate
        # Scheduled runs only. A manual run publishes whatever
        # `harness/version.json` says, which is the reviewable path for a release
        # that is not just a data refresh.
        #
        # The baseline is the rules AT THE LAST BUMP COMMIT, not the registry's
        # `latest`: a staged version is not served until a maintainer approves
        # it, so a registry comparison would see the old rules every day and
        # stage a fresh version per run until someone approved one.
        if: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          LAST_BUMP=$(git log -1 --format=%H -- harness/version.json)
          if [ -z "$LAST_BUMP" ]; then
            echo "no bump commit yet — treating as changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show "$LAST_BUMP:package-extensions.json" > /tmp/baseline.json
          # ONLY the rules. `generated` moves every run, and a `measuredVersion`
          # ticks over whenever a scanned package cuts a release, so a whole-file
          # comparison would publish daily for data nobody would notice changing.
          node -e '
            const fs = require("fs");
            const a = require("/tmp/baseline.json").packageExtensions;
            const b = require(process.env.GITHUB_WORKSPACE + "/package-extensions.json").packageExtensions;
            const same = JSON.stringify(a) === JSON.stringify(b);
            console.log(same ? "rules unchanged" : `rules moved: ${Object.keys(a).length} -> ${Object.keys(b).length} entries`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${same ? "false" : "true"}\n`);
          '

      - name: Bump the patch version
        if: ${{ github.event_name == 'schedule' && steps.gate.outputs.changed == 'true' }}
        # Patch, matching `@yarnpkg/extensions`, which reserves minor and major
        # for a change in the exported SHAPE. A consumer tracking the data with a
        # caret range keeps working across every one of these.
        run: |
          set -euo pipefail
          NEXT=$(node -e '
            const [maj, min, pat] = require("./harness/version.json").version.split(".").map(Number);
            console.log(`${maj}.${min}.${pat + 1}`);
          ')
          node -e '
            const fs = require("fs");
            const f = "harness/version.json";
            const v = JSON.parse(fs.readFileSync(f, "utf8"));
            v.version = process.argv[1];
            fs.writeFileSync(f, JSON.stringify(v, null, 2) + "\n");
          ' "$NEXT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "release: $NEXT" -- harness/version.json
          # Same race as the rebuild's own push: main moves under a run that
          # checked out at dispatch.
          for attempt in 1 2 3; do
            git push && break
            git pull --rebase origin main
          done
          echo "bumped to $NEXT"

      - name: Build the publishable directory
        if: ${{ github.event_name != 'schedule' || steps.gate.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          node harness/pack.mjs
          node -e 'console.log("packing", require("./npm/package.json").name + "@" + require("./npm/package.json").version)'

      - name: Gate
        if: ${{ github.event_name != 'schedule' || steps.gate.outputs.changed == 'true' }}
        # The same suite that guards a dataset commit. A release must not be able
        # to ship something a normal build would have refused — above all the
        # no-regression contract that every `@yarnpkg/extensions` rule survives.
        run: node harness/verify.mjs

      - name: Refuse to republish an existing version
        if: ${{ github.event_name != 'schedule' || steps.gate.outputs.changed == 'true' }}
        # `npm stage publish` would fail on a duplicate anyway, but it fails AFTER
        # uploading, and the error reads like an auth problem. Checking first
        # makes a re-run of this workflow a clean no-op instead. A version that is
        # staged but unapproved is not served, so it passes here and the stage
        # step below tolerates npm's refusal.
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./npm/package.json").version')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@nubjs%2fextensions/$VERSION")
          if [ "$CODE" = "200" ]; then
            echo "::error::@nubjs/extensions@$VERSION is already published — bump harness/version.json"
            exit 1
          fi
          echo "$VERSION is unpublished (registry returned $CODE)"

      - name: Stage
        if: ${{ !inputs.dry_run && (github.event_name != 'schedule' || steps.gate.outputs.changed == 'true') }}
        working-directory: npm
        # `--tag latest` is EXPLICIT, and it is not the redundant default it looks
        # like. npm refuses to apply `latest` IMPLICITLY when the version being
        # published is lower than one already on the registry:
        #
        #   Cannot implicitly apply the "latest" tag because previously published
        #   version 2026.9.5 is higher than the new version 1.0.0.
        #
        # This package began on calendar versions and moved to semver, so the
        # highest version on the registry is not the newest build and never will
        # be again. For a dataset `latest` means the most recent scan, not the
        # largest number, which is exactly what naming the tag says.
        #
        # A version already in the staged queue makes `npm stage publish` refuse
        # (npm reserves the number while it is staged); that refusal is a success
        # here — the maintainer's approval decides the rest. Its exact wording is
        # matched loosely because the first stage-only run is where it is observed.
        run: |
          set -euo pipefail
          out="$(mktemp)"
          if npm stage publish --access public --tag latest > "$out" 2>&1; then
            cat "$out"; exit 0
          fi
          cat "$out"
          if grep -qiE 'already (been )?staged|staged version|E409|EPUBLISHCONFLICT|previously published' "$out"; then
            echo "already staged — awaiting the maintainer's approval"; exit 0
          fi
          echo "::error::staging failed"; exit 1

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./npm/package.json").version')
          {
            echo "### @nubjs/extensions@$VERSION"
            echo
            node -e '
              const d = require("./npm/package-extensions.json");
              const t = d.totals;
              console.log(`- ${Object.keys(d.packageExtensions).length} packages, ${t.entries} entries`);
              console.log(`- classes: ${Object.entries(t.byClass).map(([k, v]) => `${k} ${v}`).join(", ")}`);
            '
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "- dry run, nothing staged"
            else
              echo "- STAGED, not installable until approved with 2FA:"
              echo
              echo '  `npm stage list @nubjs/extensions` then `npm stage approve <stage-id>`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
